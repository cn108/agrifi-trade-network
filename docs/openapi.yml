    get:
      operationId: sync_operations_retrieve
      description: |-
        GET /sync/operations/{operation_id}/ — the receipt of an applied operation.

        Lets a client that lost a response (ambiguous timeout) learn the outcome without
        resending. 404 means the operation has not been applied. Scoped to the caller.
      parameters:
      - in: path
        name: operation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sync
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    AccountTypeEnum:
      enum:
      - asset
      - liability
      - equity
      - revenue
      - expense
      type: string
      description: |-
        * `asset` - Asset (simulated)
        * `liability` - Liability (simulated)
        * `equity` - Equity
        * `revenue` - Revenue
        * `expense` - Expense
    AllocationRequest:
      type: object
      properties:
        batch:
          type: string
          format: uuid
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        client_request_id:
          type: string
          format: uuid
      required:
      - batch
      - client_request_id
      - quantity
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        action:
          type: string
          readOnly: true
        object_type:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
        request_id:
          type: string
          readOnly: true
        metadata:
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - id
      - metadata
      - object_id
      - object_type
      - request_id
    BuyerProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        business_name:
          type: string
          maxLength: 200
        region:
          type: string
          maxLength: 100
        location:
          type: string
          maxLength: 200
        verification_status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - business_name
      - created_at
      - id
      - updated_at
      - verification_status
    CropCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    CropCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        is_active:
          type: boolean
      required:
      - name
    Dispute:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        order:
          type: string
          format: uuid
          readOnly: true
        opened_by:
          type: string
          format: uuid
          readOnly: true
        reason:
          type: string
          readOnly: true
        previous_order_status:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DisputeStatusEnum'
          readOnly: true
          default: open
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          readOnly: true
        resolution_notes:
          type: string
          readOnly: true
        resolved_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - opened_by
      - order
      - outcome
      - previous_order_status
      - reason
      - resolution_notes
      - resolved_at
      - resolved_by
      - status
    DisputeStatusEnum:
      enum:
      - open
      - resolved
      type: string
      description: |-
        * `open` - Open
        * `resolved` - Resolved
    FarmerProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        display_name:
          type: string
          maxLength: 150
        region:
          type: string
          maxLength: 100
        location:
          type: string
          maxLength: 200
        verification_status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
        created_at:
