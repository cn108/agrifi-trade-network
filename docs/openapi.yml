openapi: 3.0.3
info:
  title: AgriFi Trade Network API
  version: 1.0.0
  description: 'Nigerian-first B2B agricultural marketplace. Payments, refunds, settlements
    and the ledger are SIMULATED: no real money moves. Money is integer kobo.'
paths:
  /api/v1/audit-events/:
    get:
      operationId: audit_events_list
      description: Read-only audit trail for operations administrators.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - audit-events
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/audit-events/{id}/:
    get:
      operationId: audit_events_retrieve
      description: Read-only audit trail for operations administrators.
      parameters:
      - in: path
        name: id
