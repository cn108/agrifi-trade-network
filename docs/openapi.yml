  /api/v1/listings/:
    get:
      operationId: listings_list
      description: |-
        Marketplace listings.

        * Buyers and other users see only active listings (active category and seller).
        * Farmers additionally see all of their own listings.
        * Only farmers can create; the seller is always the authenticated user.
        * Updates are limited to the owner or an operations administrator.
        * Only administrators can suspend; there is no delete (archive instead).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - listings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedListingList'
          description: ''
    post:
      operationId: listings_create
      description: |-
        Marketplace listings.

        * Buyers and other users see only active listings (active category and seller).
        * Farmers additionally see all of their own listings.
        * Only farmers can create; the seller is always the authenticated user.
        * Updates are limited to the owner or an operations administrator.
        * Only administrators can suspend; there is no delete (archive instead).
      tags:
