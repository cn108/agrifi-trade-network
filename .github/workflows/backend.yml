name: Backend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agrifi
          POSTGRES_USER: agrifi
          POSTGRES_PASSWORD: agrifi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrifi -d agrifi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "true"
      DB_NAME: agrifi
      DB_USER: agrifi
      DB_PASSWORD: agrifi
      DB_HOST: 127.0.0.1
      DB_CONN_MAX_AGE: "0"
      DB_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - name: Reverse and re-apply trigger migrations
        run: |
          python manage.py migrate audit zero --noinput
          python manage.py migrate finance zero --noinput
          python manage.py migrate orders zero --noinput
          python manage.py migrate inventory 0002_stock_ledger_and_review --noinput
          python manage.py migrate --noinput
      - name: Validate OpenAPI schema
        run: python manage.py spectacular --file /tmp/openapi.yml --validate --fail-on-warn
      - name: Run tests (PostgreSQL)
        run: python manage.py test --noinput -v 2 2>&1 | tee /tmp/backend-tests.log; exit ${PIPESTATUS[0]}
      - name: Test summary
        if: always()
        run: |
          grep -E "^(Ran |OK|FAILED)" /tmp/backend-tests.log || true
          grep -cE "\.\.\. skipped" /tmp/backend-tests.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-log
          path: /tmp/backend-tests.log
