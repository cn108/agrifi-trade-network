# Self-contained PostgreSQL test run. Needs no .env; uses a throwaway database held in
# memory with fixed, non-secret credentials. Run from the repository root:
#
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test
#   docker compose -f docker-compose.test.yml down -v
#
# It checks migrations (including reversing the immutability triggers) and then runs the
# whole suite, including the PostgreSQL-only concurrency tests.
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: agrifi
      POSTGRES_USER: agrifi
      POSTGRES_PASSWORD: agrifi-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrifi -d agrifi"]
      interval: 3s
      timeout: 5s
      retries: 20

  test:
    build:
      context: ./backend
    environment:
      DJANGO_SECRET_KEY: test-only-not-a-secret
      DJANGO_DEBUG: "true"
      DB_NAME: agrifi
      DB_USER: agrifi
      DB_PASSWORD: agrifi-test-only
      DB_HOST: postgres-test
      DB_CONN_MAX_AGE: "0"
      DB_PORT: 5432
      AGRIFI_CONTRACTS_DIR: /contracts
    volumes:
      - ./contracts:/contracts:ro
      - ./web/src/app/integration:/web/src/app/integration:ro
    command:
      - sh
      - -c
      - >-
        python manage.py check &&
        python manage.py makemigrations --check --dry-run &&
        python manage.py migrate --noinput &&
        python manage.py migrate audit zero --noinput &&
        python manage.py migrate finance zero --noinput &&
        python manage.py migrate orders zero --noinput &&
        python manage.py migrate inventory 0002_stock_ledger_and_review --noinput &&
        python manage.py migrate --noinput &&
        python manage.py test --noinput -v 2
    depends_on:
      postgres-test:
        condition: service_healthy
